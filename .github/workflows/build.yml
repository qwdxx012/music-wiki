name: Test and Build Docker Image

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    if: ${{ needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Smoke test container
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
        run: |
          docker run -d --name music-wiki -p 5000:5000 \
            -e SECRET_KEY -e LASTFM_API_KEY -e AUDD_API_TOKEN \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          sleep 5
          curl --fail --silent --show-error http://localhost:5000/ > /dev/null
          docker ps
          docker stop music-wiki
