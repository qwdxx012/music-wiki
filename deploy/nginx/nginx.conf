server {
    listen 80;
    server_name music-wiki.localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name music-wiki.localhost;

    ssl_certificate     /etc/nginx/certs/music-wiki.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/music-wiki.localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 12 МБ, чтобы прошел аудиофайл до 10 МБ из настроек Flask
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Распознавание через AudD может идти до 30 секунд
        proxy_read_timeout 65s;
    }
}
